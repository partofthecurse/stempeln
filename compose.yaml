services:
  stempeln:
    container_name: stempeln
    image: ${STEMPELN_IMAGE:-ghcr.io/partofthecurse/stempeln:latest}
    restart: unless-stopped
    environment:
      STEMPELN_DATA_DIR: /data
      TZ: ${TZ:-Europe/Berlin}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-de}
    volumes:
      - stempeln-data:/data
    ports:
      - "${STEMPELN_BIND_ADDRESS:-127.0.0.1}:${STEMPELN_PORT:-32769}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  stempeln-data:
    name: ${STEMPELN_DATA_VOLUME:-stempeln-data}
